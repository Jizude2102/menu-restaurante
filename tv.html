<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1a1a1a;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .contenedor {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    h1 {
      font-size: 3em;
      letter-spacing: 6px;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .precios {
      font-size: 1.4em;
      margin-bottom: 40px;
      color: #f0c040;
    }

    .seccion-titulo {
      font-size: 1.6em;
      letter-spacing: 4px;
      margin: 30px 0 15px;
      color: #f0c040;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    ul li {
      font-size: 1.5em;
      margin: 8px 0;
      letter-spacing: 1px;
    }

    ul li.agotado {
      text-decoration: line-through;
      color: #888888;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <h1>MENÚ</h1>
    <div class="precios">MENÚ S/12 &nbsp;+&nbsp; CEVICHE S/14</div>

    <div class="seccion-titulo">ENTRADAS</div>
    <ul>
      <li>SOPA DE CARNE</li>
      <li>HUANCAÍNA</li>
      <li class="agotado">CEVICHE</li>
    </ul>

    <div class="seccion-titulo">SEGUNDOS</div>
    <ul>
      <li>ARVERJA CON PESCADO FRITO</li>
      <li>ARROZ CON POLLO</li>
      <li>LOMO SALTADO</li>
      <li class="agotado">AJÍ DE GALLINA</li>
    </ul>
  </div>
</body>
</html>
